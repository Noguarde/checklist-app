<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Checklist</title>
</head>
<body>
  <div class="app">
    <header>
      <h1>Checklist</h1>
      <div class="header-controls">
        <button id="themeToggle" class="theme-btn" aria-label="Toggle dark mode">🌙</button>
        <label class="toggle-label">
          <span>Show done</span>
          <div class="toggle">
            <input type="checkbox" id="showCompleted">
            <span class="slider"></span>
          </div>
        </label>
      </div>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab-btn" data-cat="work" role="tab">Work</button>
      <button class="tab-btn" data-cat="household" role="tab">Household</button>
      <button class="tab-btn" data-cat="projects" role="tab">Projects / To-Dos</button>
    </div>

    <div class="focus-bar">
      <button id="focusBtn" class="focus-btn">🎲 Pick 3 to focus on</button>
    </div>

    <div id="focusPanel" class="focus-panel hidden"></div>

    <form id="addForm" class="add-form">
      <textarea id="newItem" placeholder="New item…" rows="2" maxlength="300"></textarea>
      <button type="submit">Add</button>
    </form>

    <ul id="itemList" class="item-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
